name: MiniMax Refresh

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间次日 07:00
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Validate MiniMax secret
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "${MINIMAX_API_KEY}" ]; then
            echo "MINIMAX_API_KEY is not configured or is unavailable to this workflow."
            exit 1
          fi

      - name: Call MiniMax API
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://api.minimaxi.com/anthropic/v1/messages" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MINIMAX_API_KEY}" \
            -d '{
              "model": "MiniMax-M3",
              "messages": [{"role": "user", "content": "hi"}],
              "max_tokens": 1
            }'
